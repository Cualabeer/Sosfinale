<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Mechanics | Roadside Repairs</title>
    <style>
        /* --------------------------
        🎨 COLOUR PALETTE (matches van & spec)
        -------------------------- */
        :root {
            --bg-light: #F5F7FA;
            --bg-card: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #4A4A4A;
            --border: #D0D4DD;
            --accent-green: #00D26A;
            --accent-green-hover: #00B85C;
            --error: #E53935;
            --success: #2E7D32;
            /* Golden ratio constant */
            --gr: 1.618;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(1rem * var(--gr)) calc(1rem * var(--gr) * 0.618);
            line-height: 1.5;
        }

        /* Mobile container using Golden Ratio 1 : 1.618 */
        .mobile-container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: calc(0.75rem * var(--gr));
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            aspect-ratio: 1 / var(--gr);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header / Top section */
        .header-area {
            flex: 4;
            background: linear-gradient(135deg, rgba(0, 210, 106, 0.12), var(--bg-light));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: calc(1rem * var(--gr) * 0.618);
        }

        .header-area h1 {
            font-size: calc(1.8rem * var(--gr) * 0.618);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header-area p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .accent-divider {
            width: 4rem;
            height: 0.25rem;
            background: var(--accent-green);
            border-radius: 2px;
            margin-top: 1rem;
        }

        /* Form / Bottom section */
        .form-area {
            flex: 6;
            padding: calc(1rem * var(--gr) * 0.618);
            display: flex;
            flex-direction: column;
            gap: calc(1rem * var(--gr) * 0.618);
        }

        .form-area h2 {
            font-size: 1.25rem;
            font-weight: 600;
            border-left: 2px solid var(--accent-green);
            padding-left: 0.75rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.375rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 1rem;
            transition: border 0.2s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 2px rgba(0, 210, 106, 0.2);
        }

        textarea {
            resize: none;
            min-height: 80px;
        }

        button {
            margin-top: auto;
            padding: 0.95rem;
            border: none;
            border-radius: 0.5rem;
            background: var(--accent-green);
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--accent-green-hover);
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="header-area">
            <h1>🛠️ SOS Mechanics</h1>
            <p>Roadside Repairs • Diagnostics • Honest Fixes</p>
            <div class="accent-divider"></div>
        </div>

        <div class="form-area">
            <h2>Book a Mechanic</h2>
            <div>
                <label>Your Location</label>
                <input type="text" placeholder="e.g. London, Kent">
            </div>
            <div>
                <label>Vehicle Issue</label>
                <textarea placeholder="Describe what’s happening..."></textarea>
            </div>
            <button>Confirm Booking</button>
            <p class="footer-note">📍 Serving London & Kent • 📩 Fast response • 🍪 Where’s my biscuits?</p>
        </div>
    </div>
</body>
</html>
